<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Ikigyan — Content Manager</title>
    <!-- Absolute path so the config loads whether the URL is /admin or /admin/ -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Sveltia CMS — an open-source, git-based editor. It commits directly to the
      GitHub repo; the host (Vercel) then rebuilds the site. No database, no paid
      service. Pinned to a specific version so it can never break on its own;
      bump the version number here when you deliberately want to update.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.107.2/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
